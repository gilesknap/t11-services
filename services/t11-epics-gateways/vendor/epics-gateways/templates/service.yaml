kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: LoadBalancer
  {{- $allocArgs := dict "name" .Release.Name "namespace" .Release.Namespace "baseIp" .Values.baseIp "startIp" .Values.startIp }}
  clusterIP: {{ include "allocateIpFromName" $allocArgs }}
  {{- with .Values.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  ports:
    - name: ca-server-tcp
      port: {{ .Values.caServerPort }}
      targetPort: {{ .Values.caServerPort }}
      protocol: TCP
    - name: ca-server-udp
      port: {{ .Values.caServerPort }}
      targetPort: {{ .Values.caServerPort }}
      protocol: UDP
    - name: ca-repeater-tcp
      port: {{ add1 (.Values.caServerPort) }}
      targetPort: {{ add1 (.Values.caServerPort) }}
      protocol: TCP
    - name: ca-repeater-udp
      port: {{ add1 (.Values.caServerPort) }}
      targetPort: {{ add1 (.Values.caServerPort) }}
      protocol: UDP
    - name: pva-server-tcp
      port: {{ .Values.pvaServerPort }}
      targetPort: {{ .Values.pvaServerPort }}
      protocol: TCP
    - name: pva-server-udp
      port: {{ add1 (.Values.pvaServerPort) }}
      targetPort: {{ add1 (.Values.pvaServerPort) }}
      protocol: UDP
  selector:
    app: {{ .Release.Name }}
