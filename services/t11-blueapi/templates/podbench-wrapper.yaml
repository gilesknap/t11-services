apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-podbench-wrapper
data:
  python: |
    #!/bin/bash
    while :; do
      [ ! -f /podbench/app/.podbench-ptrace.so ] || export LD_PRELOAD=/podbench/app/.podbench-ptrace.so
      if [ -d /podbench/app/src ]; then
        export PYTHONPATH=/podbench/app/src
      fi
      setsid /app/.venv/bin/python -Xfrozen_modules=off -m debugpy --listen 5678 --configure-subProcess true -m blueapi -c /config/config.yaml serve &
      child=$!
      echo $child > /tmp/podbench-child.pid
      wait $child; rc=$?
      kill -TERM -"$child" 2>/dev/null || true
      [ -e /tmp/podbench-hold ] || exit $rc
    done
